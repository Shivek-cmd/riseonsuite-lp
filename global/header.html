<style>
  .site-header {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.94);
    border-bottom: 1px solid var(--color-border);
    backdrop-filter: blur(14px);
  }

  .site-header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 72px;
  }

  .site-header__brand {
    display: inline-flex;
    align-items: center;
    gap: 0.625rem;
    color: var(--color-dark);
    font-weight: 700;
  }

  .site-header__logo {
    width: 156px;
    height: auto;
  }

  .site-header__nav {
    display: flex;
    align-items: center;
    gap: clamp(1.75rem, 2.6vw, 1rem);
    color: var(--color-dark);
    font-size: 0.95rem;
    font-weight: 600;
  }

  .site-header__nav a,
  .site-header__submenu-button {
    position: relative;
    padding-block: 0.35rem;
  }

  .site-header__nav a::after,
  .site-header__submenu-button::after {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 2px;
    content: "";
    background: var(--color-primary);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform var(--ease);
  }

  .site-header__nav a:hover::after,
  .site-header__nav a:focus-visible::after,
  .site-header__submenu:hover .site-header__submenu-button::after,
  .site-header__submenu:focus-within .site-header__submenu-button::after {
    transform: scaleX(1);
  }

  .site-header__submenu {
    position: relative;
  }

  .site-header__submenu-button {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding-inline: 0;
    color: var(--color-dark);
    background: transparent;
    font-size: inherit;
    font-weight: inherit;
  }

  .site-header__submenu-button span {
    width: 0.45rem;
    height: 0.45rem;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translateY(-1px);
    transition: transform var(--ease);
  }

  .site-header__submenu:hover .site-header__submenu-button span,
  .site-header__submenu:focus-within .site-header__submenu-button span,
  .site-header__submenu.is-open .site-header__submenu-button span {
    transform: rotate(225deg) translateY(-1px);
  }

  .site-header__submenu-menu {
    position: absolute;
    top: calc(100% + 1.1rem);
    left: 50%;
    display: grid;
    min-width: 220px;
    gap: 0.25rem;
    padding: 0.6rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.98);
    background-clip: padding-box;
    box-shadow: 0 18px 44px rgba(0, 3, 33, 0.12);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity var(--ease), transform var(--ease);
  }

  .site-header__submenu-menu::before {
    position: absolute;
    right: 0;
    bottom: 100%;
    left: 0;
    height: 1.35rem;
    content: "";
  }

  .site-header__submenu:hover .site-header__submenu-menu,
  .site-header__submenu:focus-within .site-header__submenu-menu,
  .site-header__submenu.is-open .site-header__submenu-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .site-header__submenu-menu a {
    padding: 0.75rem 0.85rem;
    border-radius: var(--radius-sm);
    color: var(--color-dark);
    transition: background-color var(--ease), color var(--ease);
  }

  .site-header__submenu-menu a:first-child {
    margin-top: 0;
  }

  .site-header__submenu-menu a::after {
    display: none;
  }

  .site-header__submenu-menu a:hover,
  .site-header__submenu-menu a:focus-visible {
    color: var(--color-primary);
    background: var(--color-primary-soft);
  }

  .site-header__actions {
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }

  .site-header__action {
    display: inline-flex;
    min-width: 96px;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    padding: 0.7rem 1.35rem;
    border: 2px solid var(--color-primary);
    border-radius: var(--radius-full);
    font-size: var(--text-sm);
    font-weight: 700;
    line-height: 1;
    transition: background-color var(--ease), color var(--ease), border-color var(--ease), transform var(--ease);
  }

  .site-header__action:hover {
    filter: brightness(0.98);
  }

  .site-header__action--primary {
    color: var(--color-surface);
    background: var(--color-primary);
  }

  .site-header__action--primary:hover {
    background: var(--color-primary-hover);
    border-color: var(--color-primary-hover);
  }

  .site-header__action--outline {
    color: var(--color-primary);
    background: var(--color-surface);
  }

  .site-header__action--outline:hover {
    color: var(--color-surface);
    background: var(--color-primary);
  }

  .site-header__menu {
    display: none;
    width: 2.75rem;
    height: 2.75rem;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    color: var(--color-dark);
    background: var(--color-surface-soft);
  }

  .site-header__menu-icon,
  .site-header__menu-icon::before,
  .site-header__menu-icon::after {
    display: block;
    width: 1.25rem;
    height: 2px;
    border-radius: var(--radius-full);
    background: currentColor;
    content: "";
    transition: transform var(--ease), opacity var(--ease);
  }

  .site-header__menu-icon {
    position: relative;
  }

  .site-header__menu-icon::before,
  .site-header__menu-icon::after {
    position: absolute;
    left: 0;
  }

  .site-header__menu-icon::before {
    top: -0.4rem;
  }

  .site-header__menu-icon::after {
    top: 0.4rem;
  }

  .site-header.is-open .site-header__menu-icon {
    transform: rotate(45deg);
  }

  .site-header.is-open .site-header__menu-icon::before {
    opacity: 0;
  }

  .site-header.is-open .site-header__menu-icon::after {
    transform: translateY(-0.4rem) rotate(-90deg);
  }

  @media (max-width: 900px) {
    .site-header__nav,
    .site-header__actions {
      display: none;
    }

    .site-header__menu {
      display: inline-flex;
    }

    .site-header.is-open .site-header__nav,
    .site-header.is-open .site-header__actions {
      display: flex;
      grid-column: 1 / -1;
      width: 100%;
    }

    .site-header.is-open .site-header__inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding-block: 0.875rem;
    }

    .site-header.is-open .site-header__brand {
      grid-column: 1;
      grid-row: 1;
    }

    .site-header.is-open .site-header__menu {
      grid-column: 2;
      grid-row: 1;
      justify-self: end;
      align-self: center;
    }

    .site-header.is-open .site-header__nav {
      align-items: flex-start;
      flex-direction: column;
      gap: 0.85rem;
      font-size: var(--text-sm);
    }

    .site-header.is-open .site-header__actions {
      align-items: stretch;
      flex-direction: column;
    }

    .site-header.is-open .site-header__nav > a,
    .site-header__submenu-button {
      width: fit-content;
    }

    .site-header__submenu {
      width: 100%;
    }

    .site-header__submenu-button {
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .site-header__submenu-menu {
      position: static;
      display: none;
      min-width: 0;
      width: auto;
      margin-top: 0.65rem;
      margin-left: 1rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .site-header__submenu-menu a {
      width: fit-content;
      padding: 0.25rem 0;
    }

    .site-header__submenu.is-open .site-header__submenu-menu,
    .site-header__submenu:focus-within .site-header__submenu-menu {
      display: grid;
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .site-header__submenu-menu a:hover,
    .site-header__submenu-menu a:focus-visible {
      background: transparent;
    }
  }
</style>

<header class="site-header" data-site-header>
  <div class="container site-header__inner">
    <a class="site-header__brand" href="/">
      <img class="site-header__logo" src="https://assets.cdn.filesafe.space/URLV5WPtDX0lzOYCl4Z9/media/69f892598de8b0ffd968a5a9.svg" alt="RiseON Suite">
    </a>

    <nav class="site-header__nav" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/pricing">Pricing</a>
      <div class="site-header__submenu" data-partners-submenu>
        <button class="site-header__submenu-button" type="button" aria-expanded="false" data-partners-toggle>
          Partners <span aria-hidden="true"></span>
        </button>
        <div class="site-header__submenu-menu" aria-label="Partner pages">
          <a href="/resellor/">Resellor</a>
          <a href="/institute-partner/">Universities/Institutes</a>
          <a href="/hr-partner/">HR Partner</a>   
        </div>
      </div>
      <a href="https://happypeopleai.com/blog">Blogs</a>
    </nav>

    <div class="site-header__actions">
      <a class="site-header__action site-header__action--primary" href="https://riseon.happypeopleai.com/signup">Sign Up</a>
      <a class="site-header__action site-header__action--outline" href="https://riseon.happypeopleai.com/login">Log In</a>
    </div>

    <button class="site-header__menu" type="button" aria-label="Toggle menu" aria-expanded="false" data-site-menu>
      <span class="site-header__menu-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>

<script>
  (() => {
    const header = document.querySelector("[data-site-header]");
    const menu = document.querySelector("[data-site-menu]");
    const partnersSubmenu = document.querySelector("[data-partners-submenu]");
    const partnersToggle = document.querySelector("[data-partners-toggle]");

    if (!header || !menu) return;

    menu.addEventListener("click", () => {
      const isOpen = header.classList.toggle("is-open");
      menu.setAttribute("aria-expanded", String(isOpen));

      if (!isOpen && partnersSubmenu && partnersToggle) {
        partnersSubmenu.classList.remove("is-open");
        partnersToggle.setAttribute("aria-expanded", "false");
      }
    });

    if (!partnersSubmenu || !partnersToggle) return;

    partnersToggle.addEventListener("click", () => {
      if (!window.matchMedia("(max-width: 900px)").matches) return;
      const isOpen = partnersSubmenu.classList.toggle("is-open");
      partnersToggle.setAttribute("aria-expanded", String(isOpen));
    });
  })();
</script>
